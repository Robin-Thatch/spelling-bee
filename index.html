<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f7da21">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Spelling Bee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <div style="width:40px"></div>
      <h1>Spelling Bee</h1>
      <div class="header-actions">
        <button id="btn-history" class="icon-btn" aria-label="Game History">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3"/>
            <circle cx="12" cy="12" r="10"/>
            <path d="M3 12a9 9 0 1 0 0"/>
          </svg>
        </button>
        <button id="btn-theme" class="icon-btn" aria-label="Toggle theme">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Game Area -->
    <main id="game-view">
      <!-- Score / Ranking -->
      <div id="score-area">
        <div id="current-rank">Beginner</div>
        <div id="score-bar-container">
          <div id="score-bar"></div>
          <div id="score-markers"></div>
        </div>
        <div id="score-value">0</div>
      </div>

      <!-- Found Words -->
      <div id="found-words-container">
        <div id="found-words"></div>
        <button id="btn-found-toggle" class="text-btn" aria-label="Show found words">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>

      <!-- Message -->
      <div id="message" class="hidden"></div>

      <!-- Input -->
      <div id="recent-words-bar"></div>
      <div id="input-area">
        <span id="input-text"></span>
        <span id="cursor">|</span>
      </div>

      <!-- Honeycomb Grid -->
      <div id="hive">
        <svg viewBox="0 0 360 320">
          <!-- Outer cells (drawn first, behind center) -->
          <polygon id="cell-0" class="hex-cell outer" points="237.0,56.3 208.5,6.9 151.5,6.9 123.0,56.3 151.5,105.6 208.5,105.6"/>
          <polygon id="cell-1" class="hex-cell outer" points="322.5,105.6 294.0,56.3 237.0,56.3 208.5,105.6 237.0,155.0 294.0,155.0"/>
          <polygon id="cell-2" class="hex-cell outer" points="322.5,204.4 294.0,155.0 237.0,155.0 208.5,204.4 237.0,253.7 294.0,253.7"/>
          <polygon id="cell-3" class="hex-cell outer" points="237.0,253.7 208.5,204.4 151.5,204.4 123.0,253.7 151.5,303.1 208.5,303.1"/>
          <polygon id="cell-4" class="hex-cell outer" points="151.5,204.4 123.0,155.0 66.0,155.0 37.5,204.4 66.0,253.7 123.0,253.7"/>
          <polygon id="cell-5" class="hex-cell outer" points="151.5,105.6 123.0,56.3 66.0,56.3 37.5,105.6 66.0,155.0 123.0,155.0"/>
          <!-- Center cell (drawn last, on top) -->
          <polygon id="cell-center" class="hex-cell center" points="237.0,155.0 208.5,105.6 151.5,105.6 123.0,155.0 151.5,204.4 208.5,204.4"/>
          <!-- Letter labels (positioned at geometric centers) -->
          <text id="letter-0" class="hex-letter" x="180" y="56.3" text-anchor="middle" dominant-baseline="central">B</text>
          <text id="letter-1" class="hex-letter" x="265.5" y="105.6" text-anchor="middle" dominant-baseline="central">C</text>
          <text id="letter-2" class="hex-letter" x="265.5" y="204.4" text-anchor="middle" dominant-baseline="central">D</text>
          <text id="letter-3" class="hex-letter" x="180" y="249.2" text-anchor="middle" dominant-baseline="central">E</text>
          <text id="letter-4" class="hex-letter" x="94.5" y="204.4" text-anchor="middle" dominant-baseline="central">F</text>
          <text id="letter-5" class="hex-letter" x="94.5" y="105.6" text-anchor="middle" dominant-baseline="central">G</text>
          <text id="letter-center" class="hex-letter center-letter" x="180" y="155" text-anchor="middle" dominant-baseline="central">A</text>
        </svg>
      </div>

      <!-- Controls -->
      <div id="controls">
        <button id="btn-delete" class="ctrl-btn">Delete</button>
        <button id="btn-hints" class="ctrl-btn icon-ctrl" aria-label="Hints">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
        <button id="btn-shuffle" class="ctrl-btn icon-ctrl" aria-label="Shuffle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>
        <button id="btn-enter" class="ctrl-btn">Enter</button>
      </div>
      <!-- Give Up / Reveal Solution -->
      <div id="give-up-area">
        <button id="btn-give-up" class="text-btn give-up-btn">Reveal Solution</button>
      </div>
    </main>

    <!-- Hints Overlay -->
    <div id="hints-overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <h2>Hints</h2>
          <button id="btn-hints-close" class="icon-btn" aria-label="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="hints-content"></div>
      </div>
    </div>

    <!-- History Overlay -->
    <div id="history-overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <h2>Game History</h2>
          <button id="btn-history-close" class="icon-btn" aria-label="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- Solution Overlay -->
    <div id="solution-overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <h2>Solution</h2>
          <button id="btn-solution-close" class="icon-btn" aria-label="Close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div id="solution-content"></div>
        <div class="solution-actions">
          <button id="btn-next-puzzle" class="primary-btn">Next Puzzle</button>
        </div>
      </div>
    </div>

    <!-- Game Complete Modal -->
    <div id="complete-overlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-header">
          <h2>Congratulations!</h2>
        </div>
        <div id="complete-message"></div>
        <div class="solution-actions">
          <button id="btn-reveal-missed" class="text-btn">Show missed words</button>
          <button id="btn-next-after-complete" class="primary-btn">Next Puzzle</button>
        </div>
      </div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="puzzle-generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
