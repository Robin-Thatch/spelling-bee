  <circle cx="237" cy="185" r="12" fill="#fff"/>
  <circle cx="275" cy="185" r="12" fill="#fff"/>
  <circle cx="240" cy="183" r="6" fill="#1a1a1a"/>
  <circle cx="278" cy="183" r="6" fill="#1a1a1a"/>
  
  <!-- Antennae -->
  <line x1="240" y1="155" x2="215" y2="115" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
  <line x1="272" y1="155" x2="297" y2="115" stroke="#2a2a2a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="215" cy="110" r="10" fill="#2a2a2a"/>
  <circle cx="297" cy="110" r="10" fill="#2a2a2a"/>
  
  <!-- Smile -->
  <path d="M237 207 Q256 222 275 207" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Stinger -->
